[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "msgcenterpy"
dynamic = ["version"]
description = "Unified message conversion system supporting ROS2, Pydantic, Dataclass, JSON, YAML, Dict, and MCP schema inter-conversion"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
    {name = "MsgCenterPy Team", email = "zgca@zgca.com"}
]
keywords = ["message", "conversion", "ros2", "pydantic", "dataclass", "json", "yaml", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
    "Topic :: Scientific/Engineering :: Interface Engine/Protocol Translator"
]

dependencies = [
    "pydantic>=2.0.0",
    "jsonschema>=4.25",
    "PyYAML>=6.0",
    "typing-extensions>=4.0.0; python_version<'3.11'"
]

[project.optional-dependencies]
ros2 = [
    "rosidl_runtime_py>=0.9.0",
    "rclpy>=3.0.0"
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "isort>=5.13.0",
    "flake8>=7.0.0",
    "Flake8-pyproject>=1.2.0",
    "mypy>=1.8.0",
    "types-jsonschema>=4.0.0",
    "types-PyYAML>=6.0.0",
    "bandit[toml]>=1.7.0",
    "pre-commit>=3.5.0",
    "bump-my-version>=0.28.0",
]
docs = [
    "sphinx>=5.0.0",
    "sphinx-rtd-theme>=1.0.0",
    "myst-parser>=0.18.0"
]
all = [
    "msgcenterpy[ros2,dev,docs]"
]

[project.urls]
Homepage = "https://github.com/ZGCA-Forge/MsgCenterPy"
Documentation = "https://zgca-forge.github.io/MsgCenterPy/"
Repository = "https://github.com/ZGCA-Forge/MsgCenterPy"
Issues = "https://github.com/ZGCA-Forge/MsgCenterPy/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["msgcenterpy*"]

[tool.setuptools.dynamic]
version = {attr = "msgcenterpy.__version__"}

# ── Formatting ────────────────────────────────────────────────

[tool.black]
line-length = 120
target-version = ["py310", "py311", "py312"]

[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3

# ── Linting ───────────────────────────────────────────────────

[tool.flake8]
max-line-length = 200
extend-ignore = ["E203", "W503", "W291", "W293", "W391", "F401", "E402", "E721", "F841", "F541"]
exclude = ["build", "dist", "__pycache__", ".mypy_cache", ".pytest_cache", "htmlcov", ".vscode", "docs/_build", "msgcenterpy.egg-info"]

# ── Type checking ─────────────────────────────────────────────

[tool.mypy]
python_version = "3.10"
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false
strict_equality = true
ignore_missing_imports = true

# ── Testing ───────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short --strict-markers --strict-config -ra --color=yes"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

# ── Security ──────────────────────────────────────────────────

[tool.bandit]
exclude_dirs = ["tests", "build", "dist"]
skips = ["B101", "B601"]

# ── Version management ────────────────────────────────────────

[tool.bumpversion]
current_version = "0.1.6"
commit = true
tag = true
push = true
tag_name = "v{new_version}"
message = "release: bump version {current_version} → {new_version}"

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'current_version = "{current_version}"'
replace = 'current_version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "msgcenterpy/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'
